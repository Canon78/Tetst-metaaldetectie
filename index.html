<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metaaldetectievondsten - Museum Editie</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-color: #141822;       /* Diep antiek leisteen */
            --card-bg: #1e2533;        /* Iets lichter voor de kaartjes */
            --text-color: #e2e8f0;     /* Zacht wit/grijs */
            --accent-gold: #d4af37;    /* Museum Goud */
            --accent-blue: #4a90e2;
            --accent-red: #e74c3c;
            --btn-green: #2ecc71;
            --btn-purple: #9b59b6;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        /* GESYMMETRISCHE HEADER IN HET MIDDEN */
        .app-header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            border-bottom: 2px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 15px;
            margin-bottom: 15px;
            margin-top: 10px;
        }

        .main-app-title-container {
            grid-column: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-align: center;
        }

        .detector-icon-svg {
            width: 32px;
            height: 32px;
            fill: var(--accent-gold);
            filter: drop-shadow(0 0 4px rgba(212, 175, 55, 0.3));
            flex-shrink: 0;
            display: block;
        }

        .main-app-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            color: var(--accent-gold);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 0;
            white-space: nowrap;
        }

        .btn-top-invoer {
            grid-column: 3;
            justify-self: end;
            background-color: transparent;
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 8px 14px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            width: auto;
            margin: 0;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .btn-top-invoer:hover {
            background-color: rgba(212, 175, 55, 0.1);
        }

        /* CHIQUE, ZACHTE GLOED VOOR DE TELLERS BOVENAAN */
        .stats-dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
            padding: 5px;
        }

        .stat-item {
            flex: 1;
            min-width: 110px;
            text-align: center;
            padding: 12px 8px;
            border-radius: 8px;
            border: 1px solid #2d3748;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s, border-color 0.2s;
        }
        .stat-item:hover {
            transform: translateY(-2px);
        }

        .stat-item.total { border-color: rgba(212, 175, 55, 0.3); background: linear-gradient(135deg, #1e2533 0%, rgba(212, 175, 55, 0.12) 100%); }
        .stat-item.total:hover { border-color: rgba(212, 175, 55, 0.7); }
        
        .stat-item.munt { border-color: rgba(241, 196, 15, 0.2); background: linear-gradient(135deg, #1e2533 0%, rgba(241, 196, 15, 0.08) 100%); }
        .stat-item.munt:hover { border-color: rgba(241, 196, 15, 0.6); }
        
        .stat-item.gesp { border-color: rgba(52, 152, 219, 0.2); background: linear-gradient(135deg, #1e2533 0%, rgba(52, 152, 219, 0.08) 100%); }
        .stat-item.gesp:hover { border-color: rgba(52, 152, 219, 0.6); }
        
        .stat-item.knoop { border-color: rgba(26, 188, 156, 0.2); background: linear-gradient(135deg, #1e2533 0%, rgba(26, 188, 156, 0.08) 100%); }
        .stat-item.knoop:hover { border-color: rgba(26, 188, 156, 0.6); }
        
        .stat-item.mili { border-color: rgba(231, 76, 60, 0.2); background: linear-gradient(135deg, #1e2533 0%, rgba(231, 76, 60, 0.08) 100%); }
        .stat-item.mili:hover { border-color: rgba(231, 76, 60, 0.6); }
        
        .stat-item.voorw { border-color: rgba(46, 204, 113, 0.2); background: linear-gradient(135deg, #1e2533 0%, rgba(46, 204, 113, 0.08) 100%); }
        .stat-item.voorw:hover { border-color: rgba(46, 204, 113, 0.6); }
        
        .stat-item.over { border-color: rgba(155, 89, 182, 0.2); background: linear-gradient(135deg, #1e2533 0%, rgba(155, 89, 182, 0.08) 100%); }
        .stat-item.over:hover { border-color: rgba(155, 89, 182, 0.6); }

        .stat-val {
            font-size: 22px;
            font-weight: bold;
            color: white;
            margin-bottom: 2px;
        }
        .stat-item.total .stat-val { color: var(--accent-gold); }

        .stat-lbl {
            font-size: 11px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: var(--accent-gold);
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .app-page {
            display: none;
        }

        .app-page.active {
            display: block;
        }

        .form-container {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid #2d3748;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .form-row .form-group {
            flex: 1;
            min-width: 150px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #94a3b8;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155 !important;
            background-color: #0f131a !important;
            color: #f1f5f9 !important;
            box-sizing: border-box;
            font-size: 16px;
            font-family: inherit;
            outline: none !important;
            box-shadow: none !important;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-gold) !important;
        }

        textarea {
            height: 90px;
            resize: vertical;
        }

        .quick-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .tag-btn {
            background-color: #1e2533;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .tag-btn:hover {
            border-color: var(--accent-gold);
            color: white;
        }

        .search-container {
            margin-bottom: 20px;
        }

        .search-input {
            border: 1px solid rgba(212, 175, 55, 0.4) !important;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="%23d4af37" class="bi bi-search" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/></svg>');
            background-repeat: no-repeat;
            background-position: 14px center;
            padding-left: 44px;
            border-radius: 30px;
            background-color: var(--card-bg) !important;
        }

        /* BEWEGENDE FILTERTABBLADEN ONDERAAN */
        .tabs {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            margin-bottom: 20px;
            padding-bottom: 5px;
        }

        .tab {
            padding: 10px 18px;
            background-color: var(--card-bg);
            border-radius: 30px;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid #334155;
            font-size: 14px;
            color: #94a3b8;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            transition: transform 0.2s, background-color 0.2s, border-color 0.2s, color 0.2s;
        }

        .tab.cat-Alles:hover { transform: translateY(-2px); border-color: rgba(212, 175, 55, 0.6); color: white; }
        .tab.cat-Munten:hover { transform: translateY(-2px); border-color: rgba(241, 196, 15, 0.6); color: white; }
        .tab.cat-Gespen:hover { transform: translateY(-2px); border-color: rgba(52, 152, 219, 0.6); color: white; }
        .tab.cat-Knopen:hover { transform: translateY(-2px); border-color: rgba(26, 188, 156, 0.6); color: white; }
        .tab.cat-Militaria:hover { transform: translateY(-2px); border-color: rgba(231, 76, 60, 0.6); color: white; }
        .tab.cat-Gebruiksvoorwerpen:hover { transform: translateY(-2px); border-color: rgba(46, 204, 113, 0.6); color: white; }
        .tab.cat-Overig:hover { transform: translateY(-2px); border-color: rgba(155, 89, 182, 0.6); color: white; }

        .tab.cat-Alles.active { background-color: #d4af37; border-color: #d4af37; color: #000; font-weight: bold; transform: none; }
        .tab.cat-Munten.active { background-color: #f1c40f; border-color: #f1c40f; color: #000; font-weight: bold; transform: none; }
        .tab.cat-Gespen.active { background-color: #3498db; border-color: #3498db; color: #fff; font-weight: bold; transform: none; }
        .tab.cat-Knopen.active { background-color: #1abc9c; border-color: #1abc9c; color: #000; font-weight: bold; transform: none; }
        .tab.cat-Militaria.active { background-color: #e74c3c; border-color: #e74c3c; color: #fff; font-weight: bold; transform: none; }
        .tab.cat-Gebruiksvoorwerpen.active { background-color: #2ecc71; border-color: #2ecc71; color: #000; font-weight: bold; transform: none; }
        .tab.cat-Overig.active { background-color: #9b59b6; border-color: #9b59b6; color: #fff; font-weight: bold; transform: none; }

        .vondst-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border-left: 4px solid #334155;
        }

        .vondst-card.cat-Munten { border-left-color: #f1c40f; }
        .vondst-card.cat-Munten .vondst-cat-badge { color: #f1c40f; }
        .vondst-card.cat-Gespen { border-left-color: #3498db; }
        .vondst-card.cat-Gespen .vondst-cat-badge { color: #3498db; }
        .vondst-card.cat-Knopen { border-left-color: #1abc9c; }
        .vondst-card.cat-Knopen .vondst-cat-badge { color: #1abc9c; }
        .vondst-card.cat-Militaria { border-left-color: #e74c3c; }
        .vondst-card.cat-Militaria .vondst-cat-badge { color: #e74c3c; }
        .vondst-card.cat-Gebruiksvoorwerpen { border-left-color: #2ecc71; }
        .vondst-card.cat-Gebruiksvoorwerpen .vondst-cat-badge { color: #2ecc71; }
        .vondst-card.cat-Overig { border-left-color: #9b59b6; }
        .vondst-card.cat-Overig .vondst-cat-badge { color: #9b59b6; }

        .vondst-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: bold;
            background-color: rgba(15, 19, 26, 0.6);
            padding: 10px 14px;
            border-radius: 6px;
            margin-bottom: 14px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .vondst-titel-text {
            color: var(--accent-gold) !important;
            letter-spacing: 0.5px;
        }

        .vondst-cat-badge {
            font-size: 13px;
            font-family: 'Segoe UI', sans-serif;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .vondst-grid-meta {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 6px 15px;
            margin-bottom: 10px;
            padding: 0 4px;
        }

        .vondst-meta {
            font-size: 14px;
            color: #cbd5e1;
        }

        .vondst-meta b {
            color: #94a3b8;
        }

        .preview-img-container {
            display: flex;
            gap: 15px;
            margin-top: 12px;
            margin-bottom: 15px;
        }

        .preview-wrapper {
            display: none;
            flex-direction: column;
            width: 48%;
            align-items: center;
            background-color: #0f131a;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            color: #cbd5e1;
        }

        .preview-wrapper span {
            font-size: 12px;
            color: var(--accent-gold);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .preview-img {
            max-width: 100%;
            max-height: 140px;
            border-radius: 6px;
            object-fit: contain;
            border: 1px solid #2d3748;
            background-color: #141822;
        }

        .btn-delete-photo {
            background-color: rgba(231, 76, 60, 0.15);
            color: #fc8181;
            border: 1px solid var(--accent-red);
            font-size: 11px;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            width: 100%;
            text-align: center;
        }

        button.main-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }

        button.gps-btn {
            background-color: #0f131a;
            color: var(--accent-blue);
            border: 1px solid rgba(74, 144, 226, 0.4);
            margin-top: 6px;
            padding: 10px;
            font-size: 14px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <div></div>
        <div class="main-app-title-container">
            <svg class="detector-icon-svg" viewBox="0 0 64 64">
                <path d="M52.1 41.4l-11.8-19c-.3-.5-.9-.8-1.5-.8h-4.3l3-7.6c.4-1 .1-2.1-.8-2.6L24.8 4.7c-.9-.5-2.1-.1-2.6.8l-3 7.6H15c-.6 0-1.2.3-1.5.8l-4.2 6.8c-.5.8-.4 1.9.3 2.6l1 1c.5.5 1.2.6 1.8.3l3.2-1.7 6.1 14.8c.2.5.7.9 1.3 1h9.1l11.8 19c.4.6 1 .9 1.7.9h4.1c1 0 1.8-.8 1.8-1.8 0-.4-.1-.9-.3-1.2zM25.7 8.3l9.4 5.2-1.6 4.1h-6.2l-1.6-4.1 3-5.2zM15 37.5c-4.1 0-7.5 3.4-7.5 7.5s3.4 7.5 7.5 7.5 7.5-3.4 7.5-7.5-3.4-7.5-7.5-7.5zm0 12.5c-2.8 0-5-2.2-5-5s2.2-5 5-5 5 2.2 5 5-2.2 5-5 5z"/>
            </svg>
            <h1 class="main-app-title">Metaaldetectievondsten</h1>
            <svg class="detector-icon-svg" viewBox="0 0 64 64">
                <path d="M52.1 41.4l-11.8-19c-.3-.5-.9-.8-1.5-.8h-4.3l3-7.6c.4-1 .1-2.1-.8-2.6L24.8 4.7c-.9-.5-2.1-.1-2.6.8l-3 7.6H15c-.6 0-1.2.3-1.5.8l-4.2 6.8c-.5.8-.4 1.9.3 2.6l1 1c.5.5 1.2.6 1.8.3l3.2-1.7 6.1 14.8c.2.5.7.9 1.3 1h9.1l11.8 19c.4.6 1 .9 1.7.9h4.1c1 0 1.8-.8 1.8-1.8 0-.4-.1-.9-.3-1.2zM25.7 8.3l9.4 5.2-1.6 4.1h-6.2l-1.6-4.1 3-5.2zM15 37.5c-4.1 0-7.5 3.4-7.5 7.5s3.4 7.5 7.5 7.5 7.5-3.4 7.5-7.5-3.4-7.5-7.5-7.5zm0 12.5c-2.8 0-5-2.2-5-5s2.2-5 5-5 5 2.2 5 5-2.2 5-5 5z"/>
            </svg>
        </div>
        <button id="top-toggle-btn" class="btn-top-invoer" onclick="toggleInvoerFormulier()">➕ Nieuwe Vondst</button>
    </div>

    <div class="stats-dashboard" id="dashboard-balk">
        <div class="stat-item total">
            <div class="stat-val" id="stat-total">0</div>
            <div class="stat-lbl">📜 Totaal</div>
        </div>
        <div class="stat-item munt">
            <div class="stat-val" id="stat-munten">0</div>
            <div class="stat-lbl">🪙 Munten</div>
        </div>
        <div class="stat-item gesp">
            <div class="stat-val" id="stat-gespen">0</div>
            <div class="stat-lbl">🔍 Gespen</div>
        </div>
        <div class="stat-item knoop">
            <div class="stat-val" id="stat-knopen">0</div>
            <div class="stat-lbl">🧷 Knopen</div>
        </div>
        <div class="stat-item mili">
            <div class="stat-val" id="stat-militaria">0</div>
            <div class="stat-lbl">🛡️ Militaria</div>
        </div>
        <div class="stat-item voorw">
            <div class="stat-val" id="stat-voorwerpen">0</div>
            <div class="stat-lbl">🗝️ Voorwerpen</div>
        </div>
        <div class="stat-item over">
            <div class="stat-val" id="stat-overig">0</div>
            <div class="stat-lbl">🏺 Overig</div>
        </div>
    </div>

    <div id="page-invoer" class="app-page">
        <div class="form-container">
            <h2 id="form-titel">Nieuwe Vondst</h2>
            <input type="hidden" id="bewerk-id" value="">
            
            <div class="form-row">
                <div class="form-group">
                    <label for="categorie">Categorie (Mapje)</label>
                    <select id="categorie">
                        <option value="Munten">🪙 Munten</option>
                        <option value="Gespen">🔍 Gespen</option>
                        <option value="Knopen">🧷 Knopen</option>
                        <option value="Militaria">🛡️ Militaria</option>
                        <option value="Gebruiksvoorwerpen">🗝️ Gebruiksvoorwerpen</option>
                        <option value="Overig">🏺 Overig / Keramiek</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="materiaal">Metaal / Materiaal</label>
                    <select id="materiaal">
                        <option value="Onbekend">❓ Onbekend</option>
                        <option value="Goud">🪙 Goud</option>
                        <option value="Zilver">🥈 Zilver</option>
                        <option value="Brons / Koper">🥉 Brons / Koper</option>
                        <option value="Lood / Tin">🛡️ Lood / Tin</option>
                        <option value="IJzer">⚙️ IJzer</option>
                        <option value="Glas / Keramiek">🏺 Glas / Keramiek</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="vondstType">Type Vondst</label>
                    <select id="vondstType">
                        <option value="Signaal (Metaaldetector)">🌟 Signaal (Metaaldetector)</option>
                        <option value="Oogvondst (Zonder detector)">👀 Oogvondst (Zonder detector)</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="staat">Staat van de vondst</label>
                    <select id="staat">
                        <option value="Bodemvondst (Topeffect)">Bodemvondst (Topeffect)</option>
                        <option value="Prachtig">✨ Prachtig</option>
                        <option value="Mooi">👍 Mooi</option>
                        <option value="Matig">📉 Matig</option>
                        <option value="Onleesbaar">❌ Onleesbaar / Afgesleten</option>
                        <option value="Voorkant blank">🔲 Voorkant blank</option>
                        <option value="Achterkant blank">🔲 Achterkant blank</option>
                        <option value="Fragment">🧩 Fragment / Stukje</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="diameter">Diameter (mm)</label>
                    <input type="number" id="diameter" step="0.1" placeholder="Bijv. 23.5">
                </div>
                <div class="form-group">
                    <label for="gewicht">Gewicht (gram)</label>
                    <input type="number" id="gewicht" step="0.01" placeholder="Bijv. 4.25">
                </div>
            </div>

            <div class="form-group">
                <label for="titel">Beschrijving / Naam</label>
                <input type="text" id="titel" placeholder="Bijv. Romeinse denarius, koperen knoop...">
            </div>

            <div class="form-group">
                <label for="datering">Vermoedelijke Periode</label>
                <input type="text" id="datering" placeholder="Bijv. 2e eeuw na Chr, 18e eeuw...">
                <div class="quick-tags">
                    <button type="button" class="tag-btn" onclick="setDatering('Romeins')">Romeins</button>
                    <button type="button" class="tag-btn" onclick="setDatering('Middeleeuws')">Middeleeuws</button>
                    <button type="button" class="tag-btn" onclick="setDatering('16e eeuw')">16e eeuw</button>
                    <button type="button" class="tag-btn" onclick="setDatering('17e eeuw')">17e eeuw</button>
                    <button type="button" class="tag-btn" onclick="setDatering('18e eeuw')">18e eeuw</button>
                    <button type="button" class="tag-btn" onclick="setDatering('19e eeuw')">19e eeuw</button>
                    <button type="button" class="tag-btn" onclick="setDatering('WO1')">WO1</button>
                    <button type="button" class="tag-btn" onclick="setDatering('WO2')">WO2</button>
                </div>
            </div>

            <div class="form-group">
                <label for="locatie-naam">📍 Stad / Dorp / Zoekveld</label>
                <input type="text" id="locatie-naam" placeholder="Bijv. Stabroek...">
            </div>

            <div class="form-group">
                <label for="locatie-gps">🌍 Exacte GPS Coördinaten of Google Maps Link</label>
                <input type="text" id="locatie-gps" placeholder="Plak hier coördinaten of de complete Google Maps link">
                <button type="button" class="gps-btn" onclick="haalGPS()">📍 Leg Huidige Exacte GPS Vast</button>
            </div>

            <div class="form-group">
                <label for="weblink">🌐 Referentie Website / Link</label>
                <input type="url" id="weblink" placeholder="https://www.example.com">
            </div>

            <div class="form-group">
                <label for="info">📜 Extra Informatie</label>
                <textarea id="info" placeholder="Waarvoor diende het? Details..."></textarea>
            </div>

            <div class="form-group">
                <label for="foto1">📸 Foto 1 (Voorkant)</label>
                <input type="file" id="foto1" accept="image/*" onchange="verwerkFoto(event, 1)">
            </div>

            <div class="form-group">
                <label for="foto2">📸 Foto 2 (Achterkant)</label>
                <input type="file" id="foto2" accept="image/*" onchange="verwerkFoto(event, 2)">
            </div>

            <div class="preview-img-container">
                <div id="wrapper-preview1" class="preview-wrapper">
                    <span>Voorkant voorbeeld</span>
                    <img id="img-preview1" class="preview-img" alt="Voorbeeld Voorkant">
                    <button type="button" class="btn-delete-photo" onclick="wisSpecifiekeFoto(1)">🗑️ Wis foto 1</button>
                </div>
                <div id="wrapper-preview2" class="preview-wrapper">
                    <span>Achterkant voorbeeld</span>
                    <img id="img-preview2" class="preview-img" alt="Voorbeeld Achterkant">
                    <button type="button" class="btn-delete-photo" onclick="wisSpecifiekeFoto(2)">🗑️ Wis foto 2</button>
                </div>
            </div>

            <button type="button" class="main-btn" onclick="opslaanVondst()">Opslaan in Cloud</button>
        </div>
    </div>

    <div id="vondsten-lijst" style="margin-top: 20px;">
        <!-- Hier komen de vondsten te staan -->
    </div>

    <!-- Firebase & Database Koppeling -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB0g9D2CFoCVOAqk3KZ0JmTQXZjooWU7WE",
            authDomain: "test-metaaldetectie.firebaseapp.com",
            projectId: "test-metaaldetectie",
            storageBucket: "test-metaaldetectie.firebasestorage.app",
            messagingSenderId: "680489884087",
            appId: "1:680489884087:web:4f0bb208d21b739156f032",
            measurementId: "G-JQ436BF560"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.toggleInvoerFormulier = function() {
            const pagina = document.getElementById('page-invoer');
            pagina.classList.toggle('active');
        };

        window.setDatering = function(periode) {
            document.getElementById('datering').value = periode;
        };

        window.haalGPS = function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    document.getElementById('locatie-gps').value = `${lat}, ${lon}`;
                    alert('GPS-coördinaten succesvol vastgelegd!');
                }, (error) => {
                    alert('Kon GPS niet ophalen: ' + error.message);
                });
            } else {
                alert('Geolocatie wordt niet ondersteund door je browser.');
            }
        };

        window.opslaanVondst = async function() {
            const titel = document.getElementById('titel').value;
            const categorie = document.getElementById('categorie').value;
            const materiaal = document.getElementById('materiaal').value;
            const datering = document.getElementById('datering').value;
            const locatieNaam = document.getElementById('locatie-naam').value;

            if (!titel) {
                alert('Vul alstublieft een beschrijving/naam in.');
                return;
            }

            try {
                await addDoc(collection(db, "vondsten"), {
                    titel,
                    categorie,
                    materiaal,
                    datering,
                    locatieNaam,
                    datum: new Date().toISOString()
                });
                alert('Vondst succesvol opgeslagen in de cloud!');
                document.getElementById('titel').value = '';
                document.getElementById('datering').value = '';
                document.getElementById('locatie-naam').value = '';
                laadVondstenUitCloud();
            } catch (e) {
                console.error("Fout bij opslaan: ", e);
                alert('Er ging iets mis bij het opslaan.');
            }
        };

        async function laadVondstenUitCloud() {
            const lijstContainer = document.getElementById('vondsten-lijst');
            lijstContainer.innerHTML = '<p style="text-align:center; color: var(--accent-gold);">Vondsten ophalen uit de cloud...</p>';
            
            try {
                const querySnapshot = await getDocs(collection(db, "vondsten"));
                lijstContainer.innerHTML = '';
                let totaal = 0;
                let munten = 0;
                let gespen = 0;
                let knopen = 0;
                let militaria = 0;
                let voorwerpen = 0;
                let overig = 0;

                querySnapshot.forEach((doc) => {
                    totaal++;
                    const data = doc.data();
                    if(data.categorie === 'Munten') munten++;
                    if(data.categorie === 'Gespen') gespen++;
                    if(data.categorie === 'Knopen') knopen++;
                    if(data.categorie === 'Militaria') militaria++;
                    if(data.categorie === 'Gebruiksvoorwerpen') voorwerpen++;
                    if(data.categorie === 'Overig') overig++;

                    const kaart = document.createElement('div');
                    kaart.className = `vondst-card cat-${data.categorie}`;
                    kaart.innerHTML = `
                        <div class="vondst-header">
                            <span class="vondst-titel-text">${data.titel}</span>
                            <span class="vondst-cat-badge">${data.categorie}</span>
                        </div>
                        <div class="vondst-grid-meta">
                            <div class="vondst-meta"><b>Materiaal:</b> ${data.materiaal}</div>
                            <div class="vondst-meta"><b>Periode:</b> ${data.datering || 'Onbekend'}</div>
                            <div class="vondst-meta"><b>Locatie:</b> ${data.locatieNaam || 'Onbekend'}</div>
                        </div>
                    `;
                    lijstContainer.appendChild(kaart);
                });

                document.getElementById('stat-total').innerText = totaal;
                document.getElementById('stat-munten').innerText = munten;
                document.getElementById('stat-gespen').innerText = gespen;
                document.getElementById('stat-knopen').innerText = knopen;
                document.getElementById('stat-militaria').innerText = militaria;
                document.getElementById('stat-voorwerpen').innerText = voorwerpen;
                document.getElementById('stat-overig').innerText = overig;
            } catch (e) {
                console.error("Fout bij laden: ", e);
            }
        }

        // Laad de vondsten zodra de pagina opent
        laadVondstenUitCloud();
    </script>
</body>
</html>
