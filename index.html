<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metaaldetectie Vondstenregistratie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fbf7f4',
                            100: '#f5ede6',
                            500: '#c59b27',
                            600: '#a67c1e',
                            700: '#866017',
                            800: '#694a15',
                            900: '#4d3511'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#121212] text-stone-100 min-h-screen flex flex-col font-sans selection:bg-amber-600 selection:text-white">

    <!-- Header -->
    <header class="bg-gradient-to-r from-[#18181b] via-[#27272a] to-[#18181b] text-white shadow-2xl border-b border-amber-600/30 sticky top-0 z-40 backdrop-blur-md bg-opacity-95">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-br from-amber-500 to-amber-700 p-3 rounded-xl shadow-lg text-stone-950 font-bold border border-amber-400/30">
                    <i class="fa-solid fa-map-location-dot text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-amber-200 via-amber-400 to-amber-600 bg-clip-text text-transparent">Metaaldetectie Vondsten</h1>
                    <p class="text-xs sm:text-sm text-stone-400">Veldlogboek & Categorieënbeheer</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="document.getElementById('vondstFormContainer').scrollIntoView({behavior: 'smooth'})" class="bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-stone-950 font-bold px-5 py-2.5 rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5 flex items-center gap-2 text-sm border border-amber-400/40">
                    <i class="fa-solid fa-plus-circle"></i> Nieuwe Vondst
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full space-y-8">

        <!-- Statistiekenbalk -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-[#1c1c1e] p-5 rounded-2xl shadow-xl border border-stone-800 flex items-center gap-4 relative overflow-hidden">
                <div class="absolute -right-4 -bottom-4 text-stone-800/40 text-6xl pointer-events-none"><i class="fa-solid fa-box-archive"></i></div>
                <div class="bg-amber-500/10 text-amber-500 p-3.5 rounded-xl border border-amber-500/20"><i class="fa-solid fa-box-archive text-xl"></i></div>
                <div>
                    <p class="text-xs text-stone-400 font-medium uppercase tracking-wider">Totaal Vondsten</p>
                    <h3 id="statTotal" class="text-2xl font-bold text-white mt-0.5">0</h3>
                </div>
            </div>
            <div class="bg-[#1c1c1e] p-5 rounded-2xl shadow-xl border border-stone-800 flex items-center gap-4 relative overflow-hidden">
                <div class="absolute -right-4 -bottom-4 text-stone-800/40 text-6xl pointer-events-none"><i class="fa-solid fa-coins"></i></div>
                <div class="bg-emerald-500/10 text-emerald-400 p-3.5 rounded-xl border border-emerald-500/20"><i class="fa-solid fa-coins text-xl"></i></div>
                <div>
                    <p class="text-xs text-stone-400 font-medium uppercase tracking-wider">Munten</p>
                    <h3 id="statCoins" class="text-2xl font-bold text-white mt-0.5">0</h3>
                </div>
            </div>
            <div class="bg-[#1c1c1e] p-5 rounded-2xl shadow-xl border border-stone-800 flex items-center gap-4 relative overflow-hidden">
                <div class="absolute -right-4 -bottom-4 text-stone-800/40 text-6xl pointer-events-none"><i class="fa-solid fa-shield-halved"></i></div>
                <div class="bg-blue-500/10 text-blue-400 p-3.5 rounded-xl border border-blue-500/20"><i class="fa-solid fa-shield-halved text-xl"></i></div>
                <div>
                    <p class="text-xs text-stone-400 font-medium uppercase tracking-wider">Militaria</p>
                    <h3 id="statMilitaria" class="text-2xl font-bold text-white mt-0.5">0</h3>
                </div>
            </div>
            <div class="bg-[#1c1c1e] p-5 rounded-2xl shadow-xl border border-stone-800 flex items-center gap-4 relative overflow-hidden">
                <div class="absolute -right-4 -bottom-4 text-stone-800/40 text-6xl pointer-events-none"><i class="fa-solid fa-layer-group"></i></div>
                <div class="bg-purple-500/10 text-purple-400 p-3.5 rounded-xl border border-purple-500/20"><i class="fa-solid fa-layer-group text-xl"></i></div>
                <div>
                    <p class="text-xs text-stone-400 font-medium uppercase tracking-wider">Overig</p>
                    <h3 id="statOther" class="text-2xl font-bold text-white mt-0.5">0</h3>
                </div>
            </div>
        </div>

        <!-- Filter & Zoekbalk -->
        <div class="bg-[#1c1c1e] p-4 rounded-2xl shadow-xl border border-stone-800 flex flex-col md:flex-row justify-between items-center gap-4">
            <div id="filterButtonsContainer" class="flex flex-wrap gap-2 w-full md:w-auto">
                <!-- Dynamische filterknoppen -->
            </div>
            <div class="w-full md:w-80 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-stone-400"><i class="fa-solid fa-search"></i></span>
                <input type="text" id="searchInput" oninput="filterVondsten()" placeholder="Zoek op titel, locatie, materiaal..." class="w-full pl-10 pr-4 py-2.5 bg-[#121212] border border-stone-800 rounded-xl text-sm text-stone-200 placeholder-stone-500 focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
            </div>
        </div>

        <!-- Invoerformulier -->
        <div id="vondstFormContainer" class="bg-[#1c1c1e] rounded-2xl shadow-2xl border border-stone-800 overflow-hidden">
            <div class="bg-gradient-to-r from-stone-900 to-[#18181b] text-white px-6 py-4 flex items-center justify-between border-b border-stone-800">
                <h2 class="font-bold text-lg flex items-center gap-2.5 text-amber-400"><i class="fa-solid fa-pen-to-square"></i> Nieuwe Vondst</h2>
                <span class="text-xs bg-amber-500/10 text-amber-400 px-3 py-1 rounded-full border border-amber-500/30 font-medium">Lokaal Logboek</span>
            </div>
            <form id="vondstForm" onsubmit="saveVondst(event)" class="p-6 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-stone-300 mb-1.5">Titel / Omschrijving *</label>
                        <input type="text" id="titel" required placeholder="Bijv. Romeinse Follis, Zilveren gesp..." class="w-full px-4 py-2.5 bg-[#121212] border border-stone-800 rounded-xl text-stone-200 placeholder-stone-600 focus:ring-2 focus:ring-amber-500 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-stone-300 mb-1.5">Categorie (Kies of typ zelf) *</label>
                        <input type="text" id="categorie" list="categorieSuggesties" required placeholder="Bijv. Munten, Militaria, Knoppen..." class="w-full px-4 py-2.5 bg-[#121212] border border-stone-800 rounded-xl text-stone-200 placeholder-stone-600 focus:ring-2 focus:ring-amber-500 focus:outline-none transition">
                        <datalist id="categorieSuggesties">
                            <option value="Munten">
                            <option value="Militaria">
                            <option value="Juwelen">
                            <option value="Knoppen">
                            <option value="Loodjes">
                            <option value="Overig">
                        </datalist>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-stone-300 mb-1.5">Locatie / Regio</label>
                        <input type="text" id="locatie" placeholder="Bijv. Omgeving Diest, Akker X..." class="w-full px-4 py-2.5 bg-[#121212] border border-stone-800 rounded-xl text-stone-200 placeholder-stone-600 focus:ring-2 focus:ring-amber-500 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-stone-300 mb-1.5">Datum Vondst</label>
                        <input type="date" id="datum" class="w-full px-4 py-2.5 bg-[#121212] border border-stone-800 rounded-xl text-stone-200 focus:ring-2 focus:ring-amber-500 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-stone-300 mb-1.5">Diepte (cm)</label>
                        <input type="number" id="diepte" placeholder="Bijv. 20" class="w-full px-4 py-2.5 bg-[#121212] border border-stone-800 rounded-xl text-stone-200 placeholder-stone-600 focus:ring-2 focus:ring-amber-500 focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-stone-300 mb-1.5">Metaal / Materiaal</label>
                        <input type="text" id="materiaal" placeholder="Bijv. Brons, Zilver, IJzer..." class="w-full px-4 py-2.5 bg-[#121212] border border-stone-800 rounded-xl text-stone-200 placeholder-stone-600 focus:ring-2 focus:ring-amber-500 focus:outline-none transition">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-stone-300 mb-1.5">Notities & Historische Context</label>
                    <textarea id="notities" rows="3" placeholder="Bijv. Conditie, keurmerken, vermoedelijke periode..." class="w-full px-4 py-2.5 bg-[#121212] border border-stone-800 rounded-xl text-stone-200 placeholder-stone-600 focus:ring-2 focus:ring-amber-500 focus:outline-none transition"></textarea>
                </div>
                <!-- Foto Upload & Compressie -->
                <div>
                    <label class="block text-sm font-medium text-stone-300 mb-1.5">Foto's toevoegen (max. 3)</label>
                    <input type="file" id="fotoInput" accept="image/*" multiple onchange="handleImageUpload(event)" class="w-full text-sm text-stone-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-amber-500/10 file:text-amber-400 hover:file:bg-amber-500/25 cursor-pointer border border-stone-800 rounded-xl bg-[#121212] p-2">
                    <div id="fotoPreviewContainer" class="flex gap-3 mt-3 flex-wrap"></div>
                </div>
                <div class="flex justify-end gap-3 pt-4 border-t border-stone-800">
                    <button type="submit" class="bg-gradient-to-r from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-stone-950 font-bold px-6 py-3 rounded-xl shadow-lg transition transform hover:-translate-y-0.5 flex items-center gap-2 border border-amber-400/40">
                        <i class="fa-solid fa-floppy-disk"></i> Vondst Opslaan
                    </button>
                </div>
            </form>
        </div>

        <!-- Overzicht Vondsten -->
        <div class="space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-xl font-bold text-stone-100">Geregistreerde Vondsten</h3>
                <span id="vondstCount" class="text-xs bg-stone-800 text-stone-300 px-3 py-1 rounded-full font-medium border border-stone-700">0 items</span>
            </div>
            <div id="vondstenLijst" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Dynamisch gevuld -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-[#18181b] text-stone-400 py-6 border-t border-stone-800 mt-12 text-center text-xs">
        <p>&copy; 2026 Metaaldetectie Vondstenbeheer. Alle rechten voorbehouden.</p>
    </footer>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4 cursor-pointer backdrop-blur-sm" onclick="closeLightbox()">
        <img id="lightboxImg" class="max-w-full max-h-[90vh] rounded-2xl shadow-2xl object-contain border border-stone-800">
    </div>

    <!-- Script -->
    <script>
        let currentFilter = 'alle';
        let compressedImages = [];
        let vondsten = JSON.parse(localStorage.getItem('md_vondsten') || '[]');

        // Zet standaarddatum op vandaag
        document.getElementById('datum').valueAsDate = new Date();

        function handleImageUpload(event) {
            const files = event.target.files;
            const container = document.getElementById('fotoPreviewContainer');
            container.innerHTML = '';
            compressedImages = [];

            if (files.length > 3) {
                alert('Je kunt maximaal 3 foto\'s selecteren.');
                event.target.value = '';
                return;
            }

            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const maxWidth = 800;
                        const scaleSize = maxWidth / img.width;
                        canvas.width = maxWidth;
                        canvas.height = img.height * (scaleSize < 1 ? scaleSize : 1);
                        
                        if (scaleSize < 1) {
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        } else {
                            ctx.drawImage(img, 0, 0, img.width, img.height);
                        }

                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        compressedImages.push(compressedDataUrl);

                        const thumbDiv = document.createElement('div');
                        thumbDiv.className = 'relative w-20 h-20 rounded-xl border border-stone-700 overflow-hidden shadow-md bg-stone-900';
                        thumbDiv.innerHTML = `<img src="${compressedDataUrl}" class="w-full h-full object-cover">`;
                        container.appendChild(thumbDiv);
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function saveVondst(e) {
            e.preventDefault();
            const categorieInput = document.getElementById('categorie').value.trim();
            const formattedCategorie = categorieInput ? categorieInput.charAt(0).toUpperCase() + categorieInput.slice(1) : 'Overig';

            const nieuweVondst = {
                id: Date.now(),
                titel: document.getElementById('titel').value,
                categorie: formattedCategorie,
                locatie: document.getElementById('locatie').value || 'Onbekend',
                datum: document.getElementById('datum').value || new Date().toISOString().split('T')[0],
                diepte: document.getElementById('diepte').value || '-',
                materiaal: document.getElementById('materiaal').value || 'Onbekend',
                notities: document.getElementById('notities').value || '',
                fotos: [...compressedImages]
            };

            vondsten.unshift(nieuweVondst);
            localStorage.setItem('md_vondsten', JSON.stringify(vondsten));

            // Reset formulier
            document.getElementById('vondstForm').reset();
            document.getElementById('datum').valueAsDate = new Date();
            document.getElementById('fotoPreviewContainer').innerHTML = '';
            compressedImages = [];

            renderVondsten();
        }

        function deleteVondst(id) {
            if (confirm('Weet je zeker dat je deze vondst wilt verwijderen?')) {
                vondsten = vondsten.filter(v => v.id !== id);
                localStorage.setItem('md_vondsten', JSON.stringify(vondsten));
                renderVondsten();
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            renderVondsten();
        }

        function renderVondsten() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const lijstEl = document.getElementById('vondstenLijst');
            
            // Unieke categorieën ophalen voor statistieken en dynamische filters
            const categorieënSet = [...new Set(vondsten.map(v => v.categorie))];

            // Statistieken bijwerken
            document.getElementById('statTotal').innerText = vondsten.length;
            document.getElementById('statCoins').innerText = vondsten.filter(v => v.categorie.toLowerCase() === 'munt' || v.categorie.toLowerCase() === 'munten').length;
            document.getElementById('statMilitaria').innerText = vondsten.filter(v => v.categorie.toLowerCase() === 'militaria').length;
            document.getElementById('statOther').innerText = vondsten.filter(v => !['munt', 'munten', 'militaria'].includes(v.categorie.toLowerCase())).length;

            // Dynamische filterknoppen opbouwen
            const filterContainer = document.getElementById('filterButtonsContainer');
            let filterHtml = `<button onclick="setFilter('alle')" class="px-4 py-2 rounded-xl text-sm font-semibold transition ${currentFilter === 'alle' ? 'bg-amber-600 text-stone-950 shadow-lg border border-amber-400/40' : 'bg-[#121212] text-stone-400 hover:bg-stone-800 border border-stone-800'}">Alle</button>`;
            
            categorieënSet.forEach(cat => {
                const isActive = currentFilter === cat;
                filterHtml += `<button onclick="setFilter('${cat}')" class="px-4 py-2 rounded-xl text-sm font-semibold transition ${isActive ? 'bg-amber-600 text-stone-950 shadow-lg border border-amber-400/40' : 'bg-[#121212] text-stone-400 hover:bg-stone-800 border border-stone-800'}">${cat}</button>`;
            });
            filterContainer.innerHTML = filterHtml;

            // Vondsten filteren
            const gefilterd = vondsten.filter(v => {
                const matchFilter = currentFilter === 'alle' || v.categorie === currentFilter;
                const matchSearch = v.titel.toLowerCase().includes(searchQuery) || v.locatie.toLowerCase().includes(searchQuery) || v.materiaal.toLowerCase().includes(searchQuery) || v.categorie.toLowerCase().includes(searchQuery);
                return matchFilter && matchSearch;
            });

            document.getElementById('vondstCount').innerText = `${gefilterd.length} items`;

            if (gefilterd.length === 0) {
                lijstEl.innerHTML = `
                    <div class="col-span-full py-16 text-center text-stone-500 bg-[#1c1c1e] rounded-2xl border border-dashed border-stone-800">
                        <i class="fa-solid fa-folder-open text-4xl mb-3 text-stone-600"></i>
                        <p class="text-sm font-medium">Geen vondsten gevonden</p>
                    </div>`;
                return;
            }

            lijstEl.innerHTML = gefilterd.map(v => `
                <div class="bg-[#1c1c1e] rounded-2xl shadow-xl border border-stone-800 overflow-hidden flex flex-col justify-between hover:border-amber-600/40 transition duration-300">
                    <div>
                        ${v.fotos && v.fotos.length > 0 ? `
                            <div class="h-48 bg-stone-900 relative overflow-hidden flex items-center justify-center">
                                <img src="${v.fotos[0]}" class="w-full h-full object-cover cursor-pointer hover:scale-105 transition duration-500" onclick="openLightbox('${v.fotos[0]}')">
                                <span class="absolute top-3 right-3 bg-stone-950/80 backdrop-blur-md text-amber-400 border border-amber-500/30 text-xs px-3 py-1 rounded-lg uppercase tracking-wider font-bold shadow-md">${escapeHtml(v.categorie)}</span>
                            </div>
                        ` : `
                            <div class="h-32 bg-stone-900/50 flex items-center justify-center text-stone-700 relative">
                                <i class="fa-solid fa-image text-3xl"></i>
                                <span class="absolute top-3 right-3 bg-stone-950/80 backdrop-blur-md text-amber-400 border border-amber-500/30 text-xs px-3 py-1 rounded-lg uppercase tracking-wider font-bold shadow-md">${escapeHtml(v.categorie)}</span>
                            </div>
                        `}
                        <div class="p-5 space-y-3.5">
                            <h4 class="font-bold text-lg text-stone-100 tracking-tight">${escapeHtml(v.titel)}</h4>
                            <div class="grid grid-cols-2 gap-2.5 text-xs text-stone-300">
                                <div class="bg-[#121212] p-2 rounded-xl border border-stone-800/80 flex items-center gap-1.5"><i class="fa-solid fa-location-dot text-amber-500"></i> <span class="truncate">${escapeHtml(v.locatie)}</span></div>
                                <div class="bg-[#121212] p-2 rounded-xl border border-stone-800/80 flex items-center gap-1.5"><i class="fa-solid fa-calendar text-amber-500"></i> ${v.datum}</div>
                                <div class="bg-[#121212] p-2 rounded-xl border border-stone-800/80 flex items-center gap-1.5"><i class="fa-solid fa-arrows-down-to-line text-amber-500"></i> ${v.diepte} cm</div>
                                <div class="bg-[#121212] p-2 rounded-xl border border-stone-800/80 flex items-center gap-1.5"><i class="fa-solid fa-hammer text-amber-500"></i> <span class="truncate">${escapeHtml(v.materiaal)}</span></div>
                            </div>
                            ${v.notities ? `<p class="text-xs text-stone-400 bg-[#121212] p-3 rounded-xl border border-stone-800/80 italic leading-relaxed">"${escapeHtml(v.notities)}"</p>` : ''}
                        </div>
                    </div>
                    <div class="px-5 py-3.5 bg-[#18181b] border-t border-stone-800 flex justify-between items-center">
                        <span class="text-xs text-stone-500">ID: ${v.id}</span>
                        <button onclick="deleteVondst(${v.id})" class="text-red-400 hover:text-red-300 text-xs font-semibold flex items-center gap-1.5 transition bg-red-500/10 hover:bg-red-500/20 px-3 py-1.5 rounded-lg border border-red-500/20">
                            <i class="fa-solid fa-trash"></i> Verwijderen
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function filterVondsten() {
            renderVondsten();
        }

        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Initieel laden
        renderVondsten();
    </script>
</body>
</html>
