<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metaaldetectie Vondstenregistratie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#fdf8f6', 100: '#f2e8e5', 500: '#8b4513', 600: '#703810', 700: '#5a2d0c' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-amber-50/40 text-stone-800 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-gradient-to-r from-stone-900 via-stone-800 to-amber-950 text-white shadow-xl border-b-4 border-amber-600">
        <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-amber-600 p-3 rounded-xl shadow-inner text-amber-100">
                    <i class="fa-solid fa-medal text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Metaaldetectie Vondsten</h1>
                    <p class="text-xs sm:text-sm text-amber-200/80">Lokale registratie & archief</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="document.getElementById('vondstFormContainer').scrollIntoView({behavior: 'smooth'})" class="bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded-lg font-medium shadow transition flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-plus"></i> Nieuwe Vondst
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full space-y-8">

        <!-- Statistiekenbalk -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-200 flex items-center gap-4">
                <div class="bg-amber-100 text-amber-800 p-3 rounded-lg"><i class="fa-solid fa-box-archive text-xl"></i></div>
                <div>
                    <p class="text-xs text-stone-500 font-medium">Totaal Vondsten</p>
                    <h3 id="statTotal" class="text-xl font-bold text-stone-800">0</h3>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-200 flex items-center gap-4">
                <div class="bg-emerald-100 text-emerald-800 p-3 rounded-lg"><i class="fa-solid fa-coins text-xl"></i></div>
                <div>
                    <p class="text-xs text-stone-500 font-medium">Munten</p>
                    <h3 id="statCoins" class="text-xl font-bold text-stone-800">0</h3>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-200 flex items-center gap-4">
                <div class="bg-blue-100 text-blue-800 p-3 rounded-lg"><i class="fa-solid fa-shield-halved text-xl"></i></div>
                <div>
                    <p class="text-xs text-stone-500 font-medium">Militaria</p>
                    <h3 id="statMilitaria" class="text-xl font-bold text-stone-800">0</h3>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-200 flex items-center gap-4">
                <div class="bg-purple-100 text-purple-800 p-3 rounded-lg"><i class="fa-solid fa-gem text-xl"></i></div>
                <div>
                    <p class="text-xs text-stone-500 font-medium">Overige Categorieën</p>
                    <h3 id="statOther" class="text-xl font-bold text-stone-800">0</h3>
                </div>
            </div>
        </div>

        <!-- Filter & Zoekbalk -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-stone-200 flex flex-col md:flex-row justify-between items-center gap-4">
            <div id="filterButtonsContainer" class="flex flex-wrap gap-2 w-full md:w-auto">
                <button onclick="setFilter('alle')" id="filter-alle" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium bg-amber-600 text-white shadow">Alle</button>
                <!-- Dynamische filterknoppen komen hier -->
            </div>
            <div class="w-full md:w-72 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone-400"><i class="fa-solid fa-search"></i></span>
                <input type="text" id="searchInput" oninput="filterVondsten()" placeholder="Zoek op titel, locatie..." class="w-full pl-10 pr-4 py-2 bg-stone-50 border border-stone-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-600">
            </div>
        </div>

        <!-- Invoerformulier -->
        <div id="vondstFormContainer" class="bg-white rounded-2xl shadow-md border border-stone-200 overflow-hidden">
            <div class="bg-stone-900 text-white px-6 py-4 flex items-center justify-between">
                <h2 class="font-semibold text-lg flex items-center gap-2"><i class="fa-solid fa-pen-to-square text-amber-500"></i> Nieuwe Vondst Registreren</h2>
                <span class="text-xs bg-amber-600/30 text-amber-300 px-2.5 py-1 rounded-full border border-amber-500/30">Lokale Modus</span>
            </div>
            <form id="vondstForm" onsubmit="saveVondst(event)" class="p-6 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-stone-700 mb-1">Titel / Omschrijving *</label>
                        <input type="text" id="titel" required placeholder="Bijv. Romeinse Follis, Zilveren gesp..." class="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-600 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-stone-700 mb-1">Categorie (Kies of typ zelf) *</label>
                        <input type="text" id="categorie" list="categorieSuggesties" required placeholder="Bijv. Munten, Romeins, Knopen..." class="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-600 focus:outline-none">
                        <datalist id="categorieSuggesties">
                            <option value="Munt">
                            <option value="Militaria">
                            <option value="Juweel / Sieraad">
                            <option value="Gereedschap">
                            <option value="Knoop">
                            <option value="Overig">
                        </datalist>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-stone-700 mb-1">Locatie / Regio</label>
                        <input type="text" id="locatie" placeholder="Bijv. Omgeving Diest, Akker X..." class="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-600 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-stone-700 mb-1">Datum Vondst</label>
                        <input type="date" id="datum" class="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-600 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-stone-700 mb-1">Diepte (cm)</label>
                        <input type="number" id="diepte" placeholder="Bijv. 20" class="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-600 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-stone-700 mb-1">Metaal / Materiaal</label>
                        <input type="text" id="materiaal" placeholder="Bijv. Brons, Zilver, IJzer..." class="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-600 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-stone-700 mb-1">Notities & Historische Context</label>
                    <textarea id="notities" rows="3" placeholder="Bijv. Conditie, keurmerken, vermoedelijke periode..." class="w-full px-3 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-600 focus:outline-none"></textarea>
                </div>
                <!-- Foto Upload & Compressie -->
                <div>
                    <label class="block text-sm font-medium text-stone-700 mb-1">Foto's toevoegen (max. 3)</label>
                    <input type="file" id="fotoInput" accept="image/*" multiple onchange="handleImageUpload(event)" class="w-full text-sm text-stone-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100 cursor-pointer">
                    <div id="fotoPreviewContainer" class="flex gap-3 mt-3 flex-wrap"></div>
                </div>
                <div class="flex justify-end gap-3 pt-4 border-t border-stone-100">
                    <button type="submit" class="bg-amber-600 hover:bg-amber-500 text-white px-6 py-2.5 rounded-lg font-medium shadow-md transition flex items-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Vondst Opslaan
                    </button>
                </div>
            </form>
        </div>

        <!-- Overzicht Vondsten -->
        <div class="space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-xl font-bold text-stone-800">Geregistreerde Vondsten</h3>
                <span id="vondstCount" class="text-xs bg-stone-200 text-stone-700 px-2.5 py-1 rounded-full font-medium">0 items</span>
            </div>
            <div id="vondstenLijst" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Dynamisch gevuld -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-stone-900 text-stone-400 py-6 border-t border-stone-800 mt-12 text-center text-xs">
        <p>&copy; 2026 Metaaldetectie Vondstenbeheer. Alle rechten voorbehouden.</p>
    </footer>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4 cursor-pointer" onclick="closeLightbox()">
        <img id="lightboxImg" class="max-w-full max-h-[90vh] rounded-lg shadow-2xl object-contain">
    </div>

    <!-- Script -->
    <script>
        let currentFilter = 'alle';
        let compressedImages = [];
        let vondsten = JSON.parse(localStorage.getItem('md_vondsten') || '[]');

        // Zet standaarddatum op vandaag
        document.getElementById('datum').valueAsDate = new Date();

        function handleImageUpload(event) {
            const files = event.target.files;
            const container = document.getElementById('fotoPreviewContainer');
            container.innerHTML = '';
            compressedImages = [];

            if (files.length > 3) {
                alert('Je kunt maximaal 3 foto\'s selecteren.');
                event.target.value = '';
                return;
            }

            for (let file of files) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const maxWidth = 800;
                        const scaleSize = maxWidth / img.width;
                        canvas.width = maxWidth;
                        canvas.height = img.height * (scaleSize < 1 ? scaleSize : 1);
                        
                        if (scaleSize < 1) {
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        } else {
                            ctx.drawImage(img, 0, 0, img.width, img.height);
                        }

                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        compressedImages.push(compressedDataUrl);

                        const thumbDiv = document.createElement('div');
                        thumbDiv.className = 'relative w-20 h-20 rounded-lg border border-stone-200 overflow-hidden shadow-sm';
                        thumbDiv.innerHTML = `<img src="${compressedDataUrl}" class="w-full h-full object-cover">`;
                        container.appendChild(thumbDiv);
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function saveVondst(e) {
            e.preventDefault();
            const categorieInput = document.getElementById('categorie').value.trim();
            // Maak de eerste letter mooi hoofdletter of laat vrije tekst zoals ingevoerd
            const formattedCategorie = categorieInput ? categorieInput.charAt(0).toUpperCase() + categorieInput.slice(1) : 'Overig';

            const nieuweVondst = {
                id: Date.now(),
                titel: document.getElementById('titel').value,
                categorie: formattedCategorie,
                locatie: document.getElementById('locatie').value || 'Onbekend',
                datum: document.getElementById('datum').value || new Date().toISOString().split('T')[0],
                diepte: document.getElementById('diepte').value || '-',
                materiaal: document.getElementById('materiaal').value || 'Onbekend',
                notities: document.getElementById('notities').value || '',
                fotos: [...compressedImages]
            };

            vondsten.unshift(nieuweVondst);
            localStorage.setItem('md_vondsten', JSON.stringify(vondsten));

            // Reset formulier
            document.getElementById('vondstForm').reset();
            document.getElementById('datum').valueAsDate = new Date();
            document.getElementById('fotoPreviewContainer').innerHTML = '';
            compressedImages = [];

            renderVondsten();
        }

        function deleteVondst(id) {
            if (confirm('Weet je zeker dat je deze vondst wilt verwijderen?')) {
                vondsten = vondsten.filter(v => v.id !== id);
                localStorage.setItem('md_vondsten', JSON.stringify(vondsten));
                renderVondsten();
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            renderVondsten();
        }

        function renderVondsten() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const lijstEl = document.getElementById('vondstenLijst');
            
            // Unieke categorieën ophalen voor statistieken en dynamische filterknoppen
            const categorieënSet = [...new Set(vondsten.map(v => v.categorie))];

            // Statistieken bijwerken
            document.getElementById('statTotal').innerText = vondsten.length;
            document.getElementById('statCoins').innerText = vondsten.filter(v => v.categorie.toLowerCase() === 'munt' || v.categorie.toLowerCase() === 'munten').length;
            document.getElementById('statMilitaria').innerText = vondsten.filter(v => v.categorie.toLowerCase() === 'militaria').length;
            document.getElementById('statOther').innerText = vondsten.filter(v => !['munt', 'munten', 'militaria'].includes(v.categorie.toLowerCase())).length;

            // Dynamische filterknoppen opbouwen
            const filterContainer = document.getElementById('filterButtonsContainer');
            let filterHtml = `<button onclick="setFilter('alle')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium ${currentFilter === 'alle' ? 'bg-amber-600 text-white shadow' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'}">Alle</button>`;
            
            categorieënSet.forEach(cat => {
                const isActive = currentFilter === cat;
                filterHtml += `<button onclick="setFilter('${cat}')" class="filter-btn px-4 py-2 rounded-lg text-sm font-medium ${isActive ? 'bg-amber-600 text-white shadow' : 'bg-stone-100 text-stone-600 hover:bg-stone-200'}">${cat}</button>`;
            });
            filterContainer.innerHTML = filterHtml;

            // Vondsten filteren
            const gefilterd = vondsten.filter(v => {
                const matchFilter = currentFilter === 'alle' || v.categorie === currentFilter;
                const matchSearch = v.titel.toLowerCase().includes(searchQuery) || v.locatie.toLowerCase().includes(searchQuery) || v.materiaal.toLowerCase().includes(searchQuery) || v.categorie.toLowerCase().includes(searchQuery);
                return matchFilter && matchSearch;
            });

            document.getElementById('vondstCount').innerText = `${gefilterd.length} items`;

            if (gefilterd.length === 0) {
                lijstEl.innerHTML = `
                    <div class="col-span-full py-12 text-center text-stone-400 bg-white rounded-2xl border border-dashed border-stone-300">
                        <i class="fa-solid fa-folder-open text-4xl mb-2 text-stone-300"></i>
                        <p class="text-sm font-medium">Geen vondsten gevonden</p>
                    </div>`;
                return;
            }

            lijstEl.innerHTML = gefilterd.map(v => `
                <div class="bg-white rounded-xl shadow-sm border border-stone-200 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                    <div>
                        ${v.fotos && v.fotos.length > 0 ? `
                            <div class="h-48 bg-stone-100 relative overflow-hidden flex items-center justify-center">
                                <img src="${v.fotos[0]}" class="w-full h-full object-cover cursor-pointer hover:scale-105 transition duration-300" onclick="openLightbox('${v.fotos[0]}')">
                                <span class="absolute top-2 right-2 bg-stone-900/70 text-white text-xs px-2.5 py-1 rounded-md uppercase tracking-wider font-semibold">${escapeHtml(v.categorie)}</span>
                            </div>
                        ` : `
                            <div class="h-32 bg-amber-50/50 flex items-center justify-center text-amber-800/40 relative">
                                <i class="fa-solid fa-image text-3xl"></i>
                                <span class="absolute top-2 right-2 bg-stone-900/70 text-white text-xs px-2.5 py-1 rounded-md uppercase tracking-wider font-semibold">${escapeHtml(v.categorie)}</span>
                            </div>
                        `}
                        <div class="p-5 space-y-3">
                            <h4 class="font-bold text-lg text-stone-900">${escapeHtml(v.titel)}</h4>
                            <div class="grid grid-cols-2 gap-2 text-xs text-stone-600">
                                <div><i class="fa-solid fa-location-dot text-amber-600 mr-1"></i> ${escapeHtml(v.locatie)}</div>
                                <div><i class="fa-solid fa-calendar text-amber-600 mr-1"></i> ${v.datum}</div>
                                <div><i class="fa-solid fa-arrows-down-to-line text-amber-600 mr-1"></i> ${v.diepte} cm diep</div>
                                <div><i class="fa-solid fa-hammer text-amber-600 mr-1"></i> ${escapeHtml(v.materiaal)}</div>
                            </div>
                            ${v.notities ? `<p class="text-xs text-stone-500 bg-stone-50 p-2.5 rounded-lg border border-stone-100 italic">"${escapeHtml(v.notities)}"</p>` : ''}
                        </div>
                    </div>
                    <div class="px-5 py-3 bg-stone-50 border-t border-stone-100 flex justify-between items-center">
                        <span class="text-xs text-stone-400">ID: ${v.id}</span>
                        <button onclick="deleteVondst(${v.id})" class="text-red-500 hover:text-red-700 text-xs font-medium flex items-center gap-1 transition">
                            <i class="fa-solid fa-trash"></i> Verwijderen
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function filterVondsten() {
            renderVondsten();
        }

        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightbox').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Initieel laden
        renderVondsten();
    </script>
</body>
</html>
